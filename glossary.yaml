# Nethesis UX glossary: single source of truth.
#
# Edit this file through pull requests only. `npm run build:data` generates
# glossary/it.tbx (read by Weblate) and the data used by the web page.
#
# Add a term only once it has been agreed: every entry is exported to Weblate.
#
# Fields:
#   id              unique slug, used for links (#term-<id>) and TBX entry ids
#   en              preferred English term
#   it              preferred Italian translation (omit when untranslatable)
#   untranslatable  true when the term stays in English in every language
#   definition      one sentence, user oriented
#   products        all | ns8 | nethsecurity | nethvoice | nethservice | neth360 | my
#   avoid.en        English words not to use for this concept
#   avoid.it        Italian translations not to use (forbidden on Weblate)
#   notes           optional usage notes
#
# Example:
#
# - id: delete
#   en: Delete
#   it: Elimina
#   definition: Permanently destroy an object.
#   products: [all]
#   avoid:
#     it: [Cancella]

# Systems and subscriptions

- id: system-key
  en: System key
  it: Chiave di sistema
  definition: The public identifier of a system registered on My Nethesis.
  products: [my, ns8, nethsecurity]
  avoid:
    en: [System ID]
    it: [Chiave sistema, ID sistema]
  notes: 'Example: "NETH-1234-5678-9ABC-DEF0-1234-5678-9ABC-DEF0".'

- id: system-secret
  en: System secret
  it: Segreto del sistema
  definition: The credential a system uses to connect to My Nethesis. It is shown only once, when it is generated.
  products: [my, ns8, nethsecurity]
  avoid:
    en: [System token, Registration token, Authentication token]
    it: [Token di sistema, Token di registrazione, Token di autenticazione]
  notes: 'Example: "my_0123456789abcdef0123.0123456789abcdef0123456789abcdef01234567".'

- id: subscription
  en: Subscription
  untranslatable: true
  definition: The plan of a registered system, such as Community or Enterprise.
  products: [all]
  avoid:
    it: [Abbonamento]

- id: add-on
  en: Add-on
  untranslatable: true
  definition: An optional feature bought on NethShop and granted to a system, such as Threat Shield.
  products: [all]
  avoid:
    en: [Entitlement, Addon, Additional service]
    it: [Servizio aggiuntivo]
  notes: 'The Italian plural does not change: "gli add-on".'

- id: nethshop
  en: NethShop
  untranslatable: true
  definition: The Nethesis online shop, where add-ons are bought.
  products: [my]
  avoid:
    en: [Nethshop]

# Features

- id: threat-shield
  en: Threat Shield
  untranslatable: true
  definition: >-
    A security service that blocks malicious IP addresses and domains using blocklists.
    The Nethesis blocklists require a subscription that includes the Threat Shield add-on.
  products: [nethsecurity, ns8]
  avoid:
    en: [Threat shield, ThreatShield]
  notes: 'Its parts are "Threat Shield IP" and "Threat Shield DNS".'

- id: multiwan
  en: MultiWAN
  untranslatable: true
  definition: The NethSecurity feature that uses several internet connections together, for load balancing or failover.
  products: [nethsecurity]
  avoid:
    en: [Multi WAN, Multi-WAN]

- id: flashstart
  en: FlashStart
  untranslatable: true
  definition: A third-party cloud filter that blocks unwanted websites through DNS, integrated in NethSecurity.
  products: [nethsecurity, my]
  avoid:
    en: [Flashstart]

# Backup

- id: backup-destination
  en: Backup destination
  it: Destinazione di backup
  definition: A storage location where backups are saved.
  products: [ns8]
  avoid:
    en: [Backup repository]
    it: [Repository di backup]

# Product names

- id: my-nethesis
  en: My Nethesis
  untranslatable: true
  definition: >-
    The Nethesis administration portal, where systems are registered and managed.
    "Nethesis administration portal" (in Italian "portale di amministrazione Nethesis")
    is a valid synonym to refer to it indirectly.
  products: [all]
  avoid:
    en: [My, my.nethesis.it]
  notes: >-
    Write "My Nethesis" in full. "My" is only an informal short form, not used in user
    interfaces.

- id: nethserver
  en: NethServer
  untranslatable: true
  definition: >-
    The Nethesis open source server for small and medium businesses. From a web interface,
    it installs and manages applications, such as mail, file sharing and NethVoice, on one
    or more nodes.
  products: [all]
  avoid:
    en: [Nethserver, NS8]
  notes: 'Write the version in full: "NethServer 8", not "NS8".'

- id: nethsecurity
  en: NethSecurity
  untranslatable: true
  definition: >-
    The Nethesis open source firewall for small and medium businesses, based on OpenWrt.
    Its installations are called units, and many units can be managed from NethServer 8
    with the NethSecurity controller.
  products: [all]
  avoid:
    en: [Nethsecurity]

- id: nethvoice
  en: NethVoice
  untranslatable: true
  definition: >-
    The Nethesis business phone system (VoIP PBX), installed as an application on
    NethServer 8. It includes NethVoice CTI, the web app users make and receive calls with.
  products: [all]
  avoid:
    en: [Nethvoice]

- id: nethvoice-cti
  en: NethVoice CTI
  untranslatable: true
  definition: The NethVoice web app for users, to make and receive calls and manage contacts, call history and presence.
  products: [nethvoice]
  avoid:
    en: [NethCTI]
  notes: >-
    Inside NethVoice, "CTI" alone is fine when the context is clear. The mobile app is called
    "NethVoice", not "NethCTI".

- id: nethlink
  en: NethLink
  untranslatable: true
  definition: The NethVoice CTI desktop app. It shows call notifications even when the browser is closed and supports click-to-call.
  products: [nethvoice]
  avoid:
    en: [Nethlink]

# Applications

- id: webtop
  en: WebTop
  untranslatable: true
  definition: The groupware application for mail, calendars, contacts and shared documents, installed on NethServer 8.
  products: [ns8, nethservice]
  avoid:
    en: [Webtop]

- id: nextcloud
  en: Nextcloud
  untranslatable: true
  definition: The third-party application for file sharing and collaboration, installed on NethServer 8.
  products: [ns8, nethservice]
  avoid:
    en: [NextCloud]
